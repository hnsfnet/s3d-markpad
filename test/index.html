<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown 笔记 - 测试</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    #test-results {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .test-summary {
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 16px;
      font-weight: 600;
    }
    .test-summary.pass {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .test-summary.fail {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .describe-block {
      margin-bottom: 24px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      overflow: hidden;
    }
    .describe-title {
      padding: 12px 16px;
      background-color: #f5f5f5;
      font-weight: 600;
      font-size: 15px;
      border-bottom: 1px solid #e0e0e0;
    }
    .dark .describe-title {
      background-color: #2d2d2d;
      border-bottom-color: #444;
    }
    .test-item {
      padding: 10px 16px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }
    .dark .test-item {
      border-bottom-color: #333;
    }
    .test-item:last-child {
      border-bottom: none;
    }
    .test-status {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      flex-shrink: 0;
    }
    .test-status.pass {
      background-color: #28a745;
      color: white;
    }
    .test-status.fail {
      background-color: #dc3545;
      color: white;
    }
    .test-name {
      flex: 1;
    }
    .test-error {
      margin-left: 30px;
      padding: 8px 12px;
      background-color: #fff3cd;
      color: #856404;
      border-radius: 4px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .dark .test-error {
      background-color: #5c4a0f;
      color: #ffd93d;
    }
    .test-duration {
      color: #666;
      font-size: 12px;
      flex-shrink: 0;
    }
    .dark .test-duration {
      color: #999;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .header h1 {
      margin: 0;
      font-size: 24px;
    }
    .back-link {
      padding: 8px 16px;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-size: 14px;
    }
    .back-link:hover {
      background-color: #0056b3;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-card {
      padding: 16px;
      background-color: #f8f9fa;
      border-radius: 8px;
      text-align: center;
    }
    .dark .stat-card {
      background-color: #2d2d2d;
    }
    .stat-value {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .stat-label {
      font-size: 12px;
      color: #666;
    }
    .dark .stat-label {
      color: #999;
    }
    .stat-value.total { color: #007bff; }
    .stat-value.pass { color: #28a745; }
    .stat-value.fail { color: #dc3545; }
    .stat-value.time { color: #6c757d; }
  </style>
</head>
<body>
  <div id="test-results">
    <div class="header">
      <h1>🧪 Markdown 笔记 - 测试套件</h1>
      <a href="../index.html" class="back-link">← 返回应用</a>
    </div>
    <div id="summary"></div>
    <div id="stats"></div>
    <div id="output"></div>
  </div>

  <script type="module">
    import { printTestSummary, renderTestResultsToDOM, runAllTests } from './test-framework.js';
    import './notes.test.js';
    import './folders.test.js';
    import './search.test.js';
    import './editor.test.js';
    import './theme.test.js';

    async function runTests() {
      const summary = await runAllTests();
      renderTestResultsToDOM('output');
      
      const summaryEl = document.getElementById('summary');
      const statsEl = document.getElementById('stats');
      
      const passRate = summary.total > 0 ? ((summary.passed / summary.total) * 100).toFixed(1) : 0;
      
      summaryEl.className = 'test-summary ' + (summary.failed === 0 ? 'pass' : 'fail');
      summaryEl.textContent = summary.failed === 0 
        ? `✅ 所有测试通过！共 ${summary.total} 个测试用例，通过率 ${passRate}%`
        : `❌ 测试失败！通过 ${summary.passed}/${summary.total}，失败 ${summary.failed} 个`;
      
      statsEl.innerHTML = `
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-value total">${summary.total}</div>
            <div class="stat-label">总测试数</div>
          </div>
          <div class="stat-card">
            <div class="stat-value pass">${summary.passed}</div>
            <div class="stat-label">通过</div>
          </div>
          <div class="stat-card">
            <div class="stat-value fail">${summary.failed}</div>
            <div class="stat-label">失败</div>
          </div>
          <div class="stat-card">
            <div class="stat-value time">${summary.duration.toFixed(0)}ms</div>
            <div class="stat-label">总耗时</div>
          </div>
        </div>
      `;
      
      printTestSummary();
    }

    runTests();
  </script>
</body>
</html>
